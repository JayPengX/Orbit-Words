<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breakout</title>
<!-- Javascript Breakout by Jake Gordon (MIT, see LICENSE), in Quadra Rewards. -->
<link href="breakout.css" rel="stylesheet">
<style>
  html, body { height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #levels, #controls { display: none; }
  /* Quadra: the court fills the frame (the original's fixed 640/800/1024 sizes are for desktops). */
  #breakout { width: 100vw !important; height: 100vh !important; margin: 0 !important; border: 0 !important; }
  #canvas { display: block !important; width: 100vw !important; height: 100vh !important; }
  #instructions { top: auto; position: absolute; left: 0; right: 0; bottom: 30%; font: 15px system-ui, sans-serif; width: 16em; white-space: normal; }
</style>
<script src="../bridge.js"></script>
</head>
<body>
<div id="breakout">
  <canvas id="canvas"></canvas>
  <div id="levels"><img id="next" class="disabled" alt=""><img id="prev" class="disabled" alt=""><span id="label"></span><span id="level"></span></div>
  <div id="controls"><input id="sound" type="checkbox"></div>
  <div id="instructions" style="display:none;">
    <div class="keyboard"></div>
    <div class="touch"></div>
  </div>
</div>
<script>
  window.soundManager = null;
  document.querySelector('#instructions .keyboard').innerHTML = quadra.L('<b>空白鍵</b> 開始<br><b>左右鍵</b> 移動球拍', '<b>space</b> to start<br><b>left/right</b> to move the paddle');
  document.querySelector('#instructions .touch').innerHTML = quadra.L('<b>點一下</b> 開始<br><b>拖曳</b> 移動球拍', '<b>tap</b> to start<br><b>drag</b> to move the paddle');
</script>
<script src="game.js"></script>
<script src="breakout.js"></script>
<script src="levels.js"></script>
<script>
  Game.ready(function () {
    Game.start('canvas', Breakout);
  });
</script>
</body>
</html>
