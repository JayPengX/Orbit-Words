<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<!-- 2048 by Gabriele Cirulli (MIT, see LICENSE), github.com/gabrielecirulli/2048,
     in Quadra Rewards: the board alone, scaled to the screen; the score goes
     through ../bridge.js. -->
<link rel="stylesheet" href="./style/main.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #faf8ef; touch-action: none; -webkit-user-select: none; user-select: none; }
  .q-stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .q-board { width: 500px; transform-origin: center center; }
  .q-hint { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; font: 600 14px system-ui, sans-serif; color: #776e65; }
  .heading, .above-game, .game-message .lower { display: none !important; }
  .game-container { margin-top: 0; }
</style>
<script src="../bridge.js"></script>
</head>
<body>
<div class="q-stage"><div class="q-board">
  <div class="heading"><div class="score-container">0</div><div class="best-container">0</div></div>
  <div class="game-container">
    <div class="game-message"><p></p><div class="lower"><a class="keep-playing-button"></a><a class="retry-button"></a></div></div>
    <div class="grid-container"><div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div><div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div><div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div><div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div></div>
    <div class="tile-container"></div>
  </div>
</div></div>
<p class="q-hint"></p>
<script>
  document.querySelector('.q-hint').textContent = quadra.L('上下左右滑動，相同數字相撞就合併', 'Swipe; equal numbers merge');
  function fit() {
    var k = Math.min((innerWidth - 16) / 500, (innerHeight - 56) / 500);
    document.querySelector('.q-board').style.transform = 'scale(' + Math.max(0.3, k) + ')';
  }
  addEventListener('resize', fit);
  fit();
</script>
<script src="js/bind_polyfill.js"></script>
<script src="js/classlist_polyfill.js"></script>
<script src="js/animframe_polyfill.js"></script>
<script src="js/keyboard_input_manager.js"></script>
<script src="js/html_actuator.js"></script>
<script src="js/grid.js"></script>
<script src="js/tile.js"></script>
<script src="js/local_storage_manager.js"></script>
<script src="js/game_manager.js"></script>
<script src="js/application.js"></script>
</body>
</html>
