<head>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="application-name" content="Quadra Rewards" />
<link rel="manifest" href="./manifest.webmanifest" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Quadra Rewards" />
<meta property="og:title" content="Quadra Rewards" />
<meta property="og:description" content="背單字、玩小遊戲、完成任務賺錢，還有所有 Quadra 服務的說明。" />
<meta property="og:url" content="https://jaypengx.github.io/Quadra-Rewards/" />
<meta property="og:image" content="https://jaypengx.github.io/Quadra-Rewards/og-image.jpg" />

<meta property="og:image" content="https://jaypengx.github.io/Quadra-Rewards/og-image-square.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="1200" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="stylesheet" href="./quadra.css" />
</head>
<body>
<div id="loading" class="loading" role="status" aria-live="polite">
  <div class="loading-box">
    <img class="loading-logo" src="./favicon.svg" alt="" width="72" height="72" />
    <p class="loading-brand">QUADRA</p>
    <p class="loading-title">Quadra Rewards</p>
    <div id="loading-spinner" class="spinner" aria-hidden="true"></div>
    <div id="loading-error" class="loading-error" hidden>
      <p id="loading-error-text"></p>
      <button id="loading-reload" class="q-btn" type="button">重新整理 · Reload</button>
    </div>
  </div>
</div>
<script>
  (function () {
    var zh = /^zh/i.test(navigator.language || '');
    function $(id) { return document.getElementById(id); }
    window.__fxFail = function (message) {
      if ($('loading').hidden) return;
      $('loading-error-text').textContent = message || (zh ? '頁面沒有正常啟動，可能是網路不穩。' : "The page didn't start, maybe a network hiccup.");
      $('loading-error').hidden = false;
      $('loading-spinner').hidden = true;
    };
    $('loading-reload').onclick = function () { location.reload(); };
    window.addEventListener('error', function () { if (!window.__fxStarted) window.__fxFail(); });
    setTimeout(function () { if (!window.__fxStarted) window.__fxFail(); }, 15000);
  })();
</script>
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34" />
      <div class="q-brand-text">
        <h1 id="title">Quadra Rewards</h1>
        <p id="status" class="q-status" aria-live="polite"></p>
      </div>
    </div>
    <nav id="tabs" class="q-tabbar" role="tablist"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>

<main class="page">
  <div id="panel-home" class="tab-panel" role="tabpanel"></div>
  <div id="panel-words" class="tab-panel" role="tabpanel" hidden></div>
  <div id="panel-games" class="tab-panel" role="tabpanel" hidden></div>
  <div id="panel-missions" class="tab-panel" role="tabpanel" hidden></div>
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="./app.js" onerror="window.__fxFail()"></script>
</body>
</html>
